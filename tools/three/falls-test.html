<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';
const W = 1080, H = 1920, FPS = 30;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e8eef2');
const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
const key = new THREE.DirectionalLight('#fff1dc', 2.4); key.position.set(4, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, far: 30 }); scene.add(key);
const rim = new THREE.DirectionalLight('#9cc4ff', 1.4); rim.position.set(-5, 4, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight('#ffffff', '#8a7a6a', 0.9));
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });
const box = (w, h, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), mat('#d9d2c4', { roughness: 0.6 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
box(60, 10, 0.2, '#e8eef2', 0, 5, -6);
const loader = new GLTFLoader();
const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));
const actors = [];
async function actor(url, height, opts) {
  const g = await load(url);
  const root = g.scene; root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
  const holder = new THREE.Group(); holder.add(root); scene.add(holder);
  const mixer = new THREE.AnimationMixer(root);
  actors.push({ holder, mixer, clips: Object.fromEntries(g.animations.map(c => [c.name, c])), ...opts });
}
const NAMES = ['BananaPeelSlip', 'RugPullFall', 'FallOnFace'];
const SEG = [[0, 'BananaPeelSlip', 5.2], [5.2, 'RugPullFall', 4.0], [9.2, 'FallOnFace', 6.2]];
for (const [t0, nm, d] of SEG) await actor('assets/converted/ual_cmu.glb', 1.8, { tl: [[t0, nm, 0]], path: () => [0, 0, 0], ry: () => 0, show: t => t >= t0 && t < t0 + d });
window.LABELS = NAMES;
// deterministic pose: pick the active segment, set the action's time directly
function pose(a, t) {
  let seg = a.tl[0]; for (const s of a.tl) if (t >= s[0]) seg = s;
  const clip = a.clips[seg[1]]; if (!clip) return;
  a.mixer.stopAllAction();
  const act = a.mixer.clipAction(clip); act.reset(); act.play();
  const lt = t - seg[0];
  act.time = seg[2] ? lt % clip.duration : Math.min(lt, clip.duration - 1e-3);
  a.mixer.update(0);
  const [x, y, z] = a.path(t); a.holder.position.set(x, y, z); a.holder.rotation.y = a.ry(t);
}
window.FRAMES = 462;
window.renderFrame = f => {
  const t = f / FPS;
  let focus = new THREE.Vector3(0, 0.9, 0);
  for (const a of actors) { a.holder.visible = a.show ? a.show(t) : true; if (!a.holder.visible) continue; pose(a, Math.max(t, a.tl[0][0])); a.holder.updateMatrixWorld(true);
    const pel = a.holder.getObjectByName('pelvis'); if (pel) { pel.getWorldPosition(focus); focus.y = 0.8; } }
  cam.position.set(focus.x + 3.2, 2.2, focus.z + 6.2); cam.lookAt(focus.x, 0.75, focus.z);
  renderer.render(scene, cam);
};
window.ready = true;
</script></body></html>
