<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';
const W = 1080, H = 1920, FPS = 30;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#cfe3ee'); scene.fog = new THREE.Fog('#cfe3ee', 14, 30);
const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
const key = new THREE.DirectionalLight('#fff1dc', 2.4); key.position.set(4, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 5; Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, far: 30 }); scene.add(key);
const rim = new THREE.DirectionalLight('#9cc4ff', 1.4); rim.position.set(-5, 4, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight('#ffffff', '#8a7a6a', 0.9));
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...o });
const box = (w, h, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };
// supermarket set: checker floor, back wall, shelves stacked with boxes, a checkout counter
const tex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { g.fillStyle = (i + j) % 2 ? '#e9e4da' : '#c9c2b6'; g.fillRect(i * 32, j * 32, 32, 32); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
box(40, 8, 0.2, '#f4efe4', 0, 4, -6);
const cols = ['#e2553f', '#f2b134', '#3f9ad8', '#5fbf4a', '#b05fd0', '#ffffff'];
for (const sx of [-4.5, 0, 4.5]) {
  box(3.8, 2.6, 0.9, '#7a8a96', sx, 1.3, -5.2);
  for (let r = 0; r < 4; r++) for (let k = 0; k < 7; k++) box(0.42, 0.45, 0.5, cols[(r * 7 + k + Math.round(sx)) % cols.length], sx - 1.6 + k * 0.53, 0.38 + r * 0.62, -4.9);
}
box(2.6, 1.0, 0.9, '#4a5a6a', 3.6, 0.5, 0.6); box(2.7, 0.08, 1.0, '#2f3a44', 3.6, 1.04, 0.6);
// cast: CC0 characters (Gobkit Vol.1, Kenney Survivors). Each gets a clip timeline [ [t0, clip, loop] ... ] and a path.
const loader = new GLTFLoader();
const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));
const actors = [];
async function actor(url, height, opts) {
  const g = await load(url);
  const root = g.scene; root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
  root.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(root, true); const s = height / (bb.max.y - bb.min.y);
  const holder = new THREE.Group(); root.scale.setScalar(s); root.position.y = -bb.min.y * s; holder.add(root); scene.add(holder);
  const mixer = new THREE.AnimationMixer(root);
  const clips = Object.fromEntries(g.animations.map(c => [c.name, c]));
  actors.push({ holder, mixer, clips, ...opts });
}
const P = t => t;
await actor('assets/gobkit-v1/GrandmaShopper.glb', 1.55, { tl: [[0, 'Walk', 1]], path: t => [-3 + t * 0.9, 0, 1.6], ry: () => Math.PI / 2 });
await actor('assets/gobkit-v1/Schoolkid.glb', 1.35, { tl: [[0, 'Run', 1]], path: t => [4.5 - t * 2.4, 0, -2.6], ry: () => -Math.PI / 2 });
await actor('assets/gobkit-v1/OfficeLady.glb', 1.7, { tl: [[0, 'Idle', 1], [1.2, 'Special', 0], [2.6, 'Idle', 1]], path: () => [-2.6, 0, -0.6], ry: () => 0.5 });
await actor('assets/gobkit-v1/Shoplifter.glb', 1.75, { tl: [[0, 'Run', 1], [2.4, 'Hit', 0], [2.8, 'Death', 0]], path: t => [Math.min(t, 2.5) * 1.9 - 3.4 + Math.max(0, Math.min(t - 2.5, 0.4)) * 0.6, 0, 0.2], ry: () => Math.PI / 2 });
await actor('assets/gobkit-v1/Cashier.glb', 1.7, { tl: [[0, 'Idle', 1]], path: () => [3.6, 0, -0.3], ry: () => 0.2 });
await actor('assets/gobkit-v1/StoreManager.glb', 1.8, { tl: [[0, 'Idle', 1], [3.3, 'Special', 1]], path: () => [1.2, 0, -1.6], ry: () => 0.6 });
await actor('ual/UAL1_Standard.glb', 1.8, { tl: [[0, 'Walk_Formal_Loop', 1], [2.2, 'Hit_Chest', 0], [2.47, 'Death01', 0]], path: t => [-1.2 + Math.min(t, 2.2) * 0.75, 0, 2.6], ry: () => Math.PI / 2 });
await actor('assets/converted/kenney_zombieA.glb', 1.8, { tl: [[0, 'idle', 1], [2.9, 'run', 1]], path: t => [-6 + Math.max(0, t - 2.9) * 2.2, 0, -1.2], ry: () => Math.PI / 2 });
// deterministic pose: pick the active segment, set the action's time directly
function pose(a, t) {
  let seg = a.tl[0]; for (const s of a.tl) if (t >= s[0]) seg = s;
  const clip = a.clips[seg[1]]; if (!clip) return;
  a.mixer.stopAllAction();
  const act = a.mixer.clipAction(clip); act.reset(); act.play();
  const lt = t - seg[0];
  act.time = seg[2] ? lt % clip.duration : Math.min(lt, clip.duration - 1e-3);
  a.mixer.update(0);
  const [x, y, z] = a.path(t); a.holder.position.set(x, y, z); a.holder.rotation.y = a.ry(t);
}
window.FRAMES = 150;
window.renderFrame = f => {
  const t = f / FPS;
  for (const a of actors) pose(a, t);
  cam.position.set(1.2 - t * 0.15, 3.0, 13.5 - t * 0.5); cam.lookAt(0.2, 1.0, 0.0);
  renderer.render(scene, cam);
};
window.ready = true;
</script></body></html>
