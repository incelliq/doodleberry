<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Canvas</title>
<style>
  :root { --bg: #f4f1ea; --panel: #ffffff; --ink: #24160e; --muted: #7a6a5c; --line: #e2dccf; --accent: #e8743a; --ok: #3f9a5a; --warn: #c9821c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1c1916; --panel: #26221e; --ink: #f2ebe2; --muted: #a8998a; --line: #3a342e; } }
  :root[data-theme="dark"] { --bg: #1c1916; --panel: #26221e; --ink: #f2ebe2; --muted: #a8998a; --line: #3a342e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  button, select, input[type=text] { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { display: grid; grid-template-columns: 230px 1fr 300px; min-height: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .slot { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .slot:hover { background: var(--line); } .slot.active { background: var(--accent); color: #fff; }
  .slot .tick { color: var(--ok); } .slot.active .tick { color: #fff; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 4px 4px; }
  #stageWrap { display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
  #draw { height: 100%; max-height: calc(100vh - 80px); aspect-ratio: 600 / 1000; background: #fffdf8; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
  #preview { width: 100%; aspect-ratio: 600 / 1000; background: #fffdf8; border: 1px solid var(--line); border-radius: 8px; }
  .pal { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer; }
  .sw input { width: 34px; height: 26px; border: 2px solid var(--line); border-radius: 6px; padding: 0; cursor: pointer; }
  .sw.active input { border-color: var(--accent); }
  #lint li { margin: 2px 0; } #lint .missing { color: var(--warn); } #lint .warn { color: var(--accent); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { max-height: 30vh; } }
</style>
</head>
<body>
<header>
  <h1>🫐 Rig Canvas</h1>
  <input id="name" type="text" value="Untitled" size="12" aria-label="Character name">
  <span class="row" role="group" aria-label="Tool">
    <button id="t-fill" class="on" title="Draw a closed shape filled with the selected palette slot">Fill shape</button>
    <button id="t-ink" title="Draw an ink line (pressure sets width)">Ink line</button>
    <button id="t-bucket" title="Click inside an area outlined in ink to fill it (small gaps in the outline are closed)">Bucket</button>
    <button id="t-pivot" title="Drag joint dots to set pivots">Pivots</button>
    <button id="t-pose" title="Pose the character: drag hands and feet (IK, Shift flips the bend), head, chest and hips; save poses and record clips">Pose</button>
  </span>
  <label>Width <input id="width" type="range" min="2" max="14" value="5"></label>
  <button id="undo">Undo</button><button id="clear">Clear slot</button>
  <button id="onion" class="on" title="Show the rest of the character faintly">Onion</button>
  <label title="Draw another view of the character (side, three-quarter...). Parts you don't redraw are inherited from the front.">View
    <select id="view" aria-label="View being drawn"></select></label>
  <span style="flex:1"></span>
  <button id="sheet" title="Open a model sheet: key poses, views and every expression">Sheet</button>
  <button id="import">Import</button><button id="export">Export .puppet</button><button id="tocast" hidden title="Write this character into the project's cast (when the canvas is opened from Studio)">Save to cast</button>
  <input id="file" type="file" accept=".json,.puppet" hidden>
</header>
<main>
  <aside id="slots" aria-label="Parts and swap shapes"></aside>
  <div id="stageWrap"><svg id="draw" viewBox="0 0 600 1000" aria-label="Drawing canvas"></svg></div>
  <aside class="right">
    <div class="row"><b>Live preview</b>
      <select id="action" aria-label="Preview action"></select>
      <select id="pview" aria-label="Preview view"></select></div>
    <svg id="preview" viewBox="0 0 600 1000" aria-label="Live puppet preview"></svg>
    <div id="posePanel" hidden>
      <h3>Pose</h3>
      <div class="row"><label>mouth <select id="p-mouth"></select></label><label>brows <select id="p-brows"></select></label><label>eyes <select id="p-eyes"></select></label></div>
      <div class="row"><button id="p-reset">Reset</button><button id="p-save" class="on">Save pose</button><select id="p-load" aria-label="Load a saved pose"></select><button id="p-del" title="Delete the selected pose">Delete</button></div>
      <h3>Record a clip</h3>
      <div class="row"><label>at <input id="p-t" type="number" min="0" step="0.1" value="0" style="width:64px"> s</label><button id="p-key">Key</button><button id="p-clip" class="on">Save clip</button></div>
      <div id="p-keys" style="font-size:12px;color:var(--muted)">no keys yet: pose, set the time, press Key; repeat; then Save clip</div>
    </div>
    <h3>Palette (colour by slot)</h3><div id="pal" class="pal"></div>
    <h3>Rig check</h3><ul id="lint" style="padding-left:18px;margin:0"></ul>
  </aside>
</main>
<script src="../loader/puppet.js"></script>
<script src="../templates/humanoid.js"></script>
<script src="../loader/acting.js"></script>
<script src="../clips/humanoid.js"></script>
<script src="vendor/perfect-freehand.js"></script>
<script src="../loader/sheet.js"></script>
<script>
  // a feature raises the format version to the one that introduced it, never lowers it (v0.9 files stay v0.9)
  const atLeast = (v, w) => { const n = x => String(x || '0').split('.').map(Number); const [a, b] = [n(v), n(w)]; return (a[0] - b[0] || (a[1] || 0) - (b[1] || 0)) >= 0 ? v : w; };

(function () {
  const T = window.TEMPLATES.humanoid;
  const KEY = 'rigcanvas.puppet';
  let P = null;
  try { const s = localStorage.getItem(KEY); if (s) P = JSON.parse(s); } catch (e) {}
  if (!P) P = Puppet.fromTemplate(T, 'Untitled');
  const $ = id => document.getElementById(id);
  let tool = 'fill', fillSlot = 'cloth1', active = { kind: 'part', id: 'head' }, onion = true, view = '';  // '' = the drawn (front) view
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

  // ---------- slots ----------
  // strokes for a slot in the current view; in another view a slot is inherited until something is drawn in it
  const ov = (create) => { if (!view) return null; P.views = P.views || {}; const v = P.views[view] = P.views[view] || { parts: {}, swaps: {} }; v.parts = v.parts || {}; v.swaps = v.swaps || {}; return v; };
  const swapList = (id, shape) => { P.swaps[id] = P.swaps[id] || { anchor: 'head', shapes: {} }; P.swaps[id].shapes = P.swaps[id].shapes || {}; return (P.swaps[id].shapes[shape] = P.swaps[id].shapes[shape] || []); };   // a template shape this character has not drawn yet
  function own(a) { const v = ov(); if (!v) return a.kind === 'part' ? P.parts[a.id].strokes : swapList(a.id, a.shape);
    return a.kind === 'part' ? (v.parts[a.id] && v.parts[a.id].strokes) || null : ((v.swaps[a.id] || {}).shapes || {})[a.shape] || null; }
  function strokesOf(a) { // writable list (creates the view override on first use)
    const o = own(a); if (o) return o; const v = ov();
    if (a.kind === 'part') { v.parts[a.id] = { ...(v.parts[a.id] || {}), strokes: [] }; return v.parts[a.id].strokes; }
    v.swaps[a.id] = v.swaps[a.id] || { shapes: {} }; v.swaps[a.id].shapes = v.swaps[a.id].shapes || {}; return (v.swaps[a.id].shapes[a.shape] = []); }
  const shown = a => own(a) || (a.kind === 'part' ? P.parts[a.id].strokes : swapList(a.id, a.shape));
  const pivotOf = id => (view && P.views && P.views[view] && P.views[view].parts[id] && P.views[view].parts[id].pivot) || P.parts[id].pivot;
  const fresh = () => ({ ...P });  // Puppet caches merged views per object; a fresh shell sees edits immediately
  function views() {
    const names = Object.keys(P.views || {});
    $('view').innerHTML = `<option value="">front (drawn)</option>` + names.map(n => `<option ${n === view ? 'selected' : ''}>${n}</option>`).join('') + `<option value="+">+ new view…</option>`;
    $('view').value = view;
    const pv = $('pview').value;
    $('pview').innerHTML = `<option value="">front</option>` + names.map(n => `<option>${n}</option>`).join('') + (names.length ? `<option value="turn">turn (front ↔ ${names[0]})</option>` : '');
    if ([...$('pview').options].some(o => o.value === pv)) $('pview').value = pv;
  }
  function slotList() {
    let h = '<h3>Body parts</h3>';
    for (const pt of T.parts) { const n = view ? (own({ kind: 'part', id: pt.id }) ? 1 : 0) : P.parts[pt.id].strokes.length; h += `<div class="slot ${active.kind === 'part' && active.id === pt.id ? 'active' : ''}" data-k="part" data-id="${pt.id}"><span>${pt.label}${pt.required ? '' : ' <small>(opt.)</small>'}</span><span class="tick">${n ? '✓' : ''}</span></div>`; }
    for (const sw of T.swaps) { h += `<h3>${sw.label}</h3>`; for (const k of sw.shapes) { const n = view ? ((own({ kind: 'swap', id: sw.id, shape: k }) || []).length) : (((P.swaps[sw.id] || {}).shapes || {})[k] || []).length; h += `<div class="slot ${active.kind === 'swap' && active.id === sw.id && active.shape === k ? 'active' : ''}" data-k="swap" data-id="${sw.id}" data-shape="${k}"><span>${k}${sw.required.includes(k) ? '' : ' <small>(opt.)</small>'}</span><span class="tick">${n ? '✓' : ''}</span></div>`; } }
    $('slots').innerHTML = h;
    $('slots').querySelectorAll('.slot').forEach(el => el.onclick = () => { active = el.dataset.k === 'part' ? { kind: 'part', id: el.dataset.id } : { kind: 'swap', id: el.dataset.id, shape: el.dataset.shape }; refresh(); });
  }
  function palette() {
    $('pal').innerHTML = T.palette.map(k => `<label class="sw ${k === fillSlot ? 'active' : ''}" data-k="${k}"><input type="color" value="${P.palette[k]}" aria-label="${k} colour"><span>${k}</span></label>`).join('');
    $('pal').querySelectorAll('.sw').forEach(el => { const inp = el.querySelector('input');
      el.onclick = () => { fillSlot = el.dataset.k; palette(); };
      inp.oninput = () => { P.palette[el.dataset.k] = inp.value; save(); drawStage(); }; });
  }

  // ---------- drawing ----------
  const svg = $('draw');
  const pt = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 600, (e.clientY - r.top) / r.height * 1000, e.pressure || 0.5]; };
  const smooth = pts => pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; return [(a[0] + p[0] * 2 + b[0]) / 4, (a[1] + p[1] * 2 + b[1]) / 4, p[2]]; });
  const fx = n => n.toFixed(1);
  function closedPath(pts) { // Catmull-Rom → cubic Béziers, closed
    const n = pts.length; if (n < 3) return '';
    let d = `M${fx(pts[0][0])} ${fx(pts[0][1])}`;
    for (let i = 0; i < n; i++) { const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += ` C${fx(p1[0] + (p2[0] - p0[0]) / 6)} ${fx(p1[1] + (p2[1] - p0[1]) / 6)} ${fx(p2[0] - (p3[0] - p1[0]) / 6)} ${fx(p2[1] - (p3[1] - p1[1]) / 6)} ${fx(p2[0])} ${fx(p2[1])}`; }
    return d + ' Z';
  }
  // Ramer-Douglas-Peucker: drop points within `tol` of the line through their neighbours (drawings stay light)
  function simplify(pts, tol) {
    if (pts.length < 3) return pts;
    const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1; const stack = [[0, pts.length - 1]];
    while (stack.length) { const [a, b] = stack.pop(); let best = -1, bd = tol;
      const [ax, ay] = pts[a], [bx, by] = pts[b], L = Math.hypot(bx - ax, by - ay) || 1;
      for (let i = a + 1; i < b; i++) { const d = Math.abs((bx - ax) * (ay - pts[i][1]) - (ax - pts[i][0]) * (by - ay)) / L; if (d > bd) { bd = d; best = i; } }
      if (best > 0) { keep[best] = 1; stack.push([a, best], [best, b]); } }
    return pts.filter((_, i) => keep[i]);
  }
  // ink: perfect-freehand outline (pressure from the pen, or simulated from speed with a mouse), simplified
  let penPressure = false;
  function freehandPath(pts, w) {
    const PF = window.PerfectFreehand; if (!PF) return inkPath(pts, w);
    const out = simplify(PF.getStroke(pts, { size: w, thinning: 0.6, smoothing: 0.55, streamline: 0.45, simulatePressure: !penPressure }), 0.35);
    if (out.length < 3) return '';
    let d = `M${fx(out[0][0])} ${fx(out[0][1])} Q`;
    for (let i = 0; i < out.length; i++) { const a = out[i], b = out[(i + 1) % out.length]; d += `${fx(a[0])} ${fx(a[1])} ${fx((a[0] + b[0]) / 2)} ${fx((a[1] + b[1]) / 2)} `; }
    return d + 'Z';
  }
  function inkPath(pts, w) { // pressure-tapered filled outline
    const n = pts.length; if (n < 2) return '';
    const L = [], R = [];
    for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)]; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
      const taper = Math.min(1, i / 4, (n - 1 - i) / 4) * 0.7 + 0.3, hw = w * (0.35 + 0.65 * pts[i][2]) * taper / 2;
      L.push([pts[i][0] + nx * hw, pts[i][1] + ny * hw]); R.push([pts[i][0] - nx * hw, pts[i][1] - ny * hw]); }
    return 'M' + L.map(p => `${fx(p[0])} ${fx(p[1])}`).join(' L') + ' L' + R.reverse().map(p => `${fx(p[0])} ${fx(p[1])}`).join(' L') + ' Z';
  }
  let live = null, dragPivot = null;
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    const p = pt(e);
    if (tool === 'pose') { poseGrab(p, e.shiftKey); return; }
    if (tool === 'pivot') { let best = null, bd = 30; for (const id of Object.keys(P.parts)) { const q = pivotOf(id), d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < bd) { bd = d; best = id; } } dragPivot = best; return; }
    if (e.pointerType === 'pen') penPressure = true;
    if (tool === 'bucket') { bucket(p); return; }
    live = [p];
  });
  svg.addEventListener('pointermove', e => {
    const p = pt(e);
    if (tool === 'pose') { if (poseDrag) { poseMove(p, e.shiftKey); drawStage(); } return; }
    if (dragPivot) { const q = [Math.round(p[0]), Math.round(p[1])]; if (view) { const v = ov(); v.parts[dragPivot] = { ...(v.parts[dragPivot] || {}), pivot: q }; } else P.parts[dragPivot].pivot = q; drawStage(); return; }
    if (!live) return; const last = live[live.length - 1]; if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 2) return;
    live.push(p); drawStage();
  });
  svg.addEventListener('pointerup', () => {
    if (tool === 'pose') { poseDrag = null; return; }
    if (dragPivot) { dragPivot = null; save(); refresh(); return; }
    if (!live) return; const live0 = live, pts = smooth(live); live = null;
    if (pts.length > 2) {
      const w = +$('width').value;
      const st = tool === 'ink' ? { d: freehandPath(live0, w * 1.8), fill: 'ink' } : { d: closedPath(simplify(pts, 1.2)), fill: fillSlot, stroke: 'ink', width: w };
      strokesOf(active).push(st); save();
    }
    refresh();
  });

  // ---------- bucket: fill the region the ink encloses, closing small gaps ----------
  function bucket(p) {
    const Wd = 600, Hd = 1000, GAP = 5, cv = document.createElement('canvas'); cv.width = Wd; cv.height = Hd;
    const g = cv.getContext('2d'); g.fillStyle = '#000'; g.strokeStyle = '#000'; g.lineJoin = g.lineCap = 'round';
    for (const st of shown(active)) { const path = new Path2D(st.d);
      if (st.fill === 'ink') g.fill(path); else if (st.stroke && st.stroke !== 'none') { g.lineWidth = st.width || 3; g.stroke(path); } }
    const a = g.getImageData(0, 0, Wd, Hd).data, wall = new Uint8Array(Wd * Hd);
    for (let i = 0; i < Wd * Hd; i++) wall[i] = a[i * 4 + 3] > 60 ? 1 : 0;
    const dilate = (m, r) => { const t = new Uint8Array(m.length), o = new Uint8Array(m.length);   // separable square max filter
      for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++) { let v = 0; for (let k = -r; k <= r && !v; k++) { const xx = x + k; if (xx >= 0 && xx < Wd) v = m[y * Wd + xx]; } t[y * Wd + x] = v; }
      for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++) { let v = 0; for (let k = -r; k <= r && !v; k++) { const yy = y + k; if (yy >= 0 && yy < Hd) v = t[yy * Wd + x]; } o[y * Wd + x] = v; }
      return o; };
    const closed = dilate(wall, GAP), sx = Math.round(p[0]), sy = Math.round(p[1]);
    if (closed[sy * Wd + sx]) { alert('Click inside the outlined area, not on the line.'); return; }
    const reg = new Uint8Array(Wd * Hd), q = [sy * Wd + sx]; reg[q[0]] = 1; let leaks = false;
    while (q.length) { const i = q.pop(), x = i % Wd, y = (i / Wd) | 0;
      if (x === 0 || y === 0 || x === Wd - 1 || y === Hd - 1) { leaks = true; break; }
      for (const j of [i - 1, i + 1, i - Wd, i + Wd]) if (!reg[j] && !closed[j]) { reg[j] = 1; q.push(j); } }
    if (leaks) { alert('That area is not closed: join the outline (gaps up to about ' + GAP * 2 + ' px are closed for you).'); return; }
    const grown = dilate(reg, GAP + 2);   // undo the gap closing and tuck the fill under the ink
    // trace the outer boundary of the region (marching squares, first contour found from the left)
    const at = (x, y) => x >= 0 && y >= 0 && x < Wd && y < Hd && grown[y * Wd + x] ? 1 : 0;
    let start = -1; for (let i = 0; i < Wd * Hd && start < 0; i++) if (grown[i]) start = i;
    let x = start % Wd, y = (start / Wd) | 0, dir = 0; const pts = []; const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
    const x0 = x, y0 = y; let guard = 0;
    do { // square tracing (Moore-style): turn left on a filled cell, right on an empty one
      pts.push([x, y]);
      for (let k = 0; k < 4; k++) { const nd = (dir + 3 + k) % 4, nx = x + DX[nd], ny = y + DY[nd]; if (at(nx, ny)) { dir = nd; x = nx; y = ny; break; } }
    } while ((x !== x0 || y !== y0) && ++guard < 200000);
    const outline = simplify(pts, 1.1);
    if (outline.length < 3) return;
    strokesOf(active).unshift({ d: closedPath(outline), fill: fillSlot });   // under the ink
    save(); refresh();
  }

  // ---------- pose mode (plan 3.3): drag hands and feet by IK, rotate head and chest, raise or lower the hips ----------
  // The stage renders the puppet at its hip pivot on the ground line at scale 1, so stage points are artboard points.
  let poseW = { angles: {}, offset: [0, 0] }, poseDrag = null, keys = [];
  const LIMB_OF = { hand_R: 'arm_R', hand_L: 'arm_L', foot_R: 'leg_R', foot_L: 'leg_L' };
  const rootX = () => P.parts.hip.pivot[0];
  const ptOf = (part, at) => Puppet.pointOf(fresh(), part, at || null, rootX(), P.ground, { ...poseW, view });
  function handles() {
    const h = [];
    for (const e of Object.keys(LIMB_OF)) if (P.parts[e]) h.push({ id: e, kind: 'ik', at: ptOf(e) });
    if (P.parts.head) { const top = (P.anchors && P.anchors.bubble) ? ptOf('head', P.anchors.bubble) : ptOf('head', [P.parts.head.pivot[0], P.parts.head.pivot[1] - 120]); h.push({ id: 'head', kind: 'rot', at: top }); }
    const chest = P.parts.torso ? 'torso' : null;
    if (chest) { const c = P.parts[chest].pivot, top = P.parts.neck ? P.parts.neck.pivot : [c[0], c[1] - 150]; h.push({ id: chest, kind: 'rot', at: ptOf(chest, top) }); }
    h.push({ id: 'hip', kind: 'lift', at: ptOf('hip') });
    return h;
  }
  function poseGrab(p, flip) {
    let best = null, bd = 34; for (const h of handles()) { const d = Math.hypot(h.at[0] - p[0], h.at[1] - p[1]); if (d < bd) { bd = d; best = h; } }
    if (!best) return;
    const piv = best.kind === 'rot' ? ptOf(best.id, P.parts[best.id].pivot) : null;
    poseDrag = { ...best, start: p, piv, a0: poseW.angles[best.id] || 0, off0: [...(poseW.offset || [0, 0])],
      feet: Object.fromEntries(['foot_L', 'foot_R'].filter(f => P.parts[f]).map(f => [f, ptOf(f)])) };   // where the feet stand when the drag begins
  }
  function poseMove(p, flip) {
    const d = poseDrag, A = { ...poseW.angles };
    if (d.kind === 'ik') { const [u, l, e, bend] = Acting.LIMBS[LIMB_OF[d.id]], off = poseW.offset || [0, 0];
      Object.assign(A, Acting.ik2(fresh(), { ...poseW, angles: A }, u, l, e, [p[0] - off[0], p[1] - off[1]], bend * (flip ? -1 : 1))); }
    else if (d.kind === 'rot') { const ang = q => Math.atan2(q[1] - d.piv[1], q[0] - d.piv[0]) * 180 / Math.PI;
      let da = ang(p) - ang(d.start); while (da > 180) da -= 360; while (da < -180) da += 360; A[d.id] = Math.round((d.a0 + da) * 10) / 10; }
    else if (d.kind === 'lift') {   // hips up or down with the feet kept planted (both legs re-solved by IK)
      poseW.offset = [0, Math.max(-200, Math.min(160, Math.round(d.off0[1] + p[1] - d.start[1])))];
      const cx = P.parts.hip.pivot[0];
      for (const [f, at] of Object.entries(d.feet)) { const [u, l, e] = Acting.LIMBS[LIMB_OF[f]], tgt = [at[0] - poseW.offset[0], at[1] - poseW.offset[1]];
        // the knee goes outward, away from the body's centre line (a front view splays both knees)
        const tries = [1, -1].map(b => { const sol = Acting.ik2(fresh(), { ...poseW, angles: A }, u, l, e, tgt, b);
          const knee = Puppet.pointOf(fresh(), l, null, rootX(), P.ground, { ...poseW, angles: { ...A, ...sol }, view }); return { sol, out: Math.abs(knee[0] - cx) }; });
        Object.assign(A, tries[0].out >= tries[1].out ? tries[0].sol : tries[1].sol); } }
    for (const [k, lim] of Object.entries(P.parts).map(([k, v]) => [k, v.limits]).filter(x => x[1])) if (A[k] != null) A[k] = Math.max(lim[0], Math.min(lim[1], A[k]));
    poseW.angles = A;
  }
  function drawPose() {
    let s = `<line x1="0" y1="${P.ground}" x2="600" y2="${P.ground}" stroke="#d8cfc0" stroke-width="2"/>`;
    s += Puppet.render(fresh(), rootX(), P.ground, { ...poseW, view, blink: 0 });
    for (const h of handles()) { const on = poseDrag && poseDrag.id === h.id, col = h.kind === 'ik' ? '#e8743a' : h.kind === 'rot' ? '#3b6ea8' : '#3f9a5a';
      s += `<circle cx="${h.at[0]}" cy="${h.at[1]}" r="${on ? 15 : 12}" fill="${col}" fill-opacity="0.75" stroke="#fff" stroke-width="3"><title>${h.id}: ${h.kind === 'ik' ? 'drag to place (Shift flips the bend)' : h.kind === 'rot' ? 'drag to turn' : 'drag up or down'}</title></circle>`; }
    svg.innerHTML = s;
  }
  const round = v => Math.round(v * 10) / 10;
  const poseValue = () => ({ angles: Object.fromEntries(Object.entries(poseW.angles).filter(([, v]) => Math.abs(v) > 0.05).map(([k, v]) => [k, round(v)])),
    ...(poseW.offset && poseW.offset[1] ? { offset: poseW.offset } : {}), ...Object.fromEntries(['mouth', 'brows', 'eyes'].filter(k => poseW[k]).map(k => [k, poseW[k]])) });
  function posePanel() {
    for (const k of ['mouth', 'brows', 'eyes']) { const shapes = Object.keys(((P.swaps || {})[k] || {}).shapes || {});
      $('p-' + k).innerHTML = '<option value="">(rest)</option>' + shapes.map(n => `<option ${poseW[k] === n ? 'selected' : ''}>${n}</option>`).join('');
      $('p-' + k).onchange = () => { poseW[k] = $('p-' + k).value || undefined; drawStage(); }; }
    const names = Object.keys(P.poses || {});
    $('p-load').innerHTML = '<option value="">load a pose…</option>' + names.map(n => `<option>${n}</option>`).join('');
    $('p-keys').textContent = keys.length ? keys.map(k => k.t.toFixed(1) + ' s').join(' · ') : 'no keys yet: pose, set the time, press Key; repeat; then Save clip';
    rebuildActions();
  }
  function rebuildActions() {
    const cur = $('action').value, own = Object.keys(P.clips || {}), poses = Object.keys(P.poses || {});
    $('action').innerHTML = (own.length ? '<optgroup label="This character">' + own.map(k => `<option value="clip:${k}">${k}</option>`).join('') + '</optgroup>' : '') +
      (poses.length ? '<optgroup label="Saved poses">' + poses.map(k => `<option value="pose:${k}">${k}</option>`).join('') + '</optgroup>' : '') +
      '<optgroup label="Clips">' + Object.keys(LIB.clips).map(k => `<option value="clip:${k}">${k}</option>`).join('') + '</optgroup>' +
      '<optgroup label="Presets">' + Object.keys(LIB.presets).map(k => `<option value="pose:${k}">${k}</option>`).join('') + '</optgroup><option value="talk">lip-sync test</option>';
    if ([...$('action').options].some(o => o.value === cur)) $('action').value = cur;
  }
  $('p-reset').onclick = () => { poseW = { angles: {}, offset: [0, 0] }; posePanel(); drawStage(); };
  $('p-save').onclick = () => { const n = (prompt('Name this pose (it is saved in the character):', 'my_pose') || '').trim().replace(/\W+/g, '_'); if (!n) return;
    P.poses = P.poses || {}; P.poses[n] = poseValue(); save(); posePanel(); $('action').value = 'pose:' + n; };
  $('p-load').onchange = () => { const v = (P.poses || {})[$('p-load').value]; if (!v) return; poseW = { angles: { ...(v.angles || {}) }, offset: v.offset || [0, 0], mouth: v.mouth, brows: v.brows, eyes: v.eyes }; posePanel(); drawStage(); };
  $('p-del').onclick = () => { const n = $('p-load').value; if (n && P.poses && P.poses[n] && confirm(`Delete pose "${n}"?`)) { delete P.poses[n]; save(); posePanel(); } };
  $('p-key').onclick = () => { const t = Math.max(0, +$('p-t').value || 0); keys = keys.filter(k => Math.abs(k.t - t) > 1e-6).concat([{ t, pose: poseValue() }]).sort((a, b) => a.t - b.t);
    $('p-t').value = (t + 0.5).toFixed(1); posePanel(); };
  $('p-clip').onclick = () => { if (keys.length < 2) return alert('Key at least two poses at different times first.');
    const n = (prompt('Name this clip (it is saved in the character):', 'my_clip') || '').trim().replace(/\W+/g, '_'); if (!n) return;
    const parts = [...new Set(keys.flatMap(k => Object.keys(k.pose.angles)))], tracks = {};
    for (const id of parts) tracks[id] = keys.map(k => [round(k.t), k.pose.angles[id] || 0]);
    const clip = { duration: round(keys[keys.length - 1].t), tracks };
    if (keys.some(k => k.pose.offset)) clip.offset = keys.map(k => [round(k.t), k.pose.offset || [0, 0]]);
    for (const sw of ['mouth', 'brows', 'eyes']) if (keys.some(k => k.pose[sw])) clip.swaps = { ...(clip.swaps || {}), [sw]: keys.filter(k => k.pose[sw]).map(k => [round(k.t), k.pose[sw]]) };
    P.clips = P.clips || {}; P.clips[n] = clip; P.version = atLeast(P.version, '0.7'); keys = []; save(); posePanel(); $('action').value = 'clip:' + n; };

  // ---------- stage ----------
  function drawStage() {
    if (tool === 'pose') return drawPose();
    let s = `<g fill="none" stroke="#c9bba8" stroke-width="2" stroke-dasharray="6 6">${T.guide.map(d => `<path d="${d}"/>`).join('')}</g>`;
    s += `<line x1="0" y1="${T.ground}" x2="600" y2="${T.ground}" stroke="#d8cfc0" stroke-width="2"/>`;
    if (onion) s += `<g opacity="0.35">${Puppet.render(fresh(), P.parts.hip.pivot[0], P.ground, { view })}</g>`;
    // the active slot at full strength, in rest pose (swap shapes drawn relative to their anchor's rest pose);
    // in another view an inherited slot shows dimmed until it is redrawn
    const inherited = view && !own(active), strokes = shown(active);
    if (inherited) s += `<text x="300" y="40" text-anchor="middle" font-size="18" fill="#8a7a66">inherited from the front view: draw to replace it in "${view}"</text><g opacity="0.45">`;
    for (const st of strokes) { const fill = st.fill && st.fill[0] !== '#' && st.fill !== 'none' ? P.palette[st.fill] : st.fill; const line = st.stroke ? (P.palette[st.stroke] || st.stroke) : 'none';
      s += `<path d="${st.d}" fill="${fill}" stroke="${line}" stroke-width="${st.width || 0}" stroke-linejoin="round"/>`; }
    if (inherited) s += '</g>';
    if (live && live.length > 1) s += `<path d="M${live.map(p => `${fx(p[0])} ${fx(p[1])}`).join(' L')}" fill="none" stroke="${tool === 'ink' ? P.palette.ink : P.palette[fillSlot]}" stroke-width="${tool === 'ink' ? $('width').value * 1.4 : 3}" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>`;
    // joints: the active part's pivot is highlighted
    for (const id of Object.keys(P.parts)) { const on = active.kind === 'part' && active.id === id, q = pivotOf(id);
      s += `<circle cx="${q[0]}" cy="${q[1]}" r="${on ? 9 : 6}" fill="${on ? '#e8743a' : '#fff'}" stroke="#24160e" stroke-width="2"><title>${id}</title></circle>`; }
    svg.innerHTML = s;
  }
  function refresh() { views(); slotList(); drawStage(); const issues = Puppet.lint(P, T); $('lint').innerHTML = issues.length ? issues.slice(0, 14).map(i => `<li class="${i.level}">${i.msg}</li>`).join('') + (issues.length > 14 ? `<li>…and ${issues.length - 14} more</li>` : '') : '<li style="color:var(--ok)">Ready to animate ✓</li>'; }

  // ---------- live preview ----------
  // previews come from the same clip library and acting solver the films use
  const LIB = window.CLIPLIB.humanoid;
  const TALK = [[0, 'closed'], [0.12, 'mid'], [0.24, 'wide'], [0.36, 'small'], [0.46, 'O'], [0.6, 'smile'], [0.72, 'FV'], [0.84, 'mid'], [0.98, 'closed'], [1.3, 'closed']];
  $('action').innerHTML = '<optgroup label="Clips">' + Object.keys(LIB.clips).map(k => `<option value="clip:${k}">${k}</option>`).join('') + '</optgroup>' +
    '<optgroup label="Presets">' + Object.keys(LIB.presets).map(k => `<option value="pose:${k}">${k}</option>`).join('') + '</optgroup><option value="talk">lip-sync test</option>';
  function previewPose(t) {
    const [kind, name] = $('action').value.split(':');
    const tl = { clips: [{ clip: 'idle', start: 0, fadeIn: 0 }], springs: true, look: [[0, [0.6, 0]]] };
    if (kind === 'clip' && name !== 'idle') { const c = (P.clips || {})[name] || LIB.clips[name], d = c.duration + (c.loop ? 0 : 0.8); tl.clips.push({ clip: name, start: Math.floor(t / d) * d, weight: 2 }); }
    if (kind === 'pose') tl.poses = [[0, name]];
    if (kind === 'talk') tl.visemes = TALK.map(([k, v]) => [Math.floor(t / 1.3) * 1.3 + k, v]);
    const pv = $('pview').value; if (pv === 'turn') { const n = Object.keys(P.views || {})[0], c = Math.floor(t / 1.5); tl.view = [[c * 1.5, c % 2 ? n : 'front'], [c * 1.5 + 1.5, c % 2 ? 'front' : n]]; } else if (pv) tl.view = [[0, pv]];
    try { return Acting.evaluate(P, tl, t, LIB.clips, LIB.presets); } catch (e) { return {}; }
  }
  function tick(ms) { const t = ms / 1000; $('preview').innerHTML = `<line x1="0" y1="${P.ground}" x2="600" y2="${P.ground}" stroke="#d8cfc0" stroke-width="3"/>` + Puppet.render(fresh(), 300, P.ground, previewPose(t)); requestAnimationFrame(tick); }

  // ---------- toolbar ----------
  const setTool = t => { tool = t; ['fill', 'ink', 'bucket', 'pivot', 'pose'].forEach(k => $('t-' + k).classList.toggle('on', k === t)); $('posePanel').hidden = t !== 'pose'; if (t === 'pose') posePanel(); drawStage(); };
  $('t-fill').onclick = () => setTool('fill'); $('t-ink').onclick = () => setTool('ink'); $('t-bucket').onclick = () => setTool('bucket'); $('t-pivot').onclick = () => setTool('pivot'); $('t-pose').onclick = () => setTool('pose');
  $('sheet').onclick = () => { const svgTxt = Sheet.build(fresh(), (window.CLIPLIB || {})[P.template] || (window.CLIPLIB || {}).humanoid);
    const w = window.open('', '_blank'); if (!w) return; w.document.write(`<title>${(P.name || 'puppet')} model sheet</title><body style="margin:0;background:#ddd">${svgTxt}<p><a download="${(P.name || 'puppet').replace(/\W+/g, '_')}_sheet.svg" href="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgTxt)}">Download SVG</a></p></body>`); };
  $('undo').onclick = () => { const o = own(active); if (o) o.pop(); save(); refresh(); };
  $('clear').onclick = () => { if (!confirm(view ? `Remove the "${view}" drawing of this slot (it will inherit the front again)?` : 'Clear everything drawn in this slot?')) return;
    if (view) { const v = ov(); if (active.kind === 'part') delete v.parts[active.id]; else if (v.swaps[active.id]) delete v.swaps[active.id].shapes[active.shape]; } else strokesOf(active).length = 0; save(); refresh(); };
  $('view').onchange = () => { let v = $('view').value;
    if (v === '+') { v = (prompt('Name the new view (e.g. side, 3q, back):', 'side') || '').trim().replace(/\W+/g, '_'); if (v) { P.views = P.views || {}; P.views[v] = P.views[v] || { parts: {}, swaps: {} }; P.version = atLeast(P.version, '0.2'); save(); } }
    view = v === '+' ? view : v; refresh(); };
  $('onion').onclick = () => { onion = !onion; $('onion').classList.toggle('on', onion); drawStage(); };
  $('name').value = P.name; $('name').oninput = () => { P.name = $('name').value; save(); };
  $('export').onclick = () => { P.meta = { ...(P.meta || {}), created: new Date().toISOString().slice(0, 10) };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(P, null, 1)], { type: 'application/json' })); a.download = (P.name || 'puppet').replace(/\W+/g, '_') + '.puppet.json'; a.click(); };
  $('import').onclick = () => $('file').click();
  // opened from Studio (served by `python -m dbe serve`): save straight into cast/ through the API
  if (location.protocol.startsWith('http')) fetch('/api').then(r => r.ok && ($('tocast').hidden = false)).catch(() => {});
  $('tocast').onclick = async () => { const id = (prompt('Cast id (file cast/drawn/<id>.puppet.json, or an existing cast path):', (P.meta && P.meta.cast_path) || (P.name || 'character').toLowerCase().replace(/\W+/g, '_')) || '').trim(); if (!id) return;
    const r = await (await fetch('/api/puppet.save', { method: 'POST', body: JSON.stringify({ path: id, puppet: P }) })).json();
    alert(r.error ? 'Not saved: ' + r.error : `Saved ${r.result.path} (${r.result.poses} poses, ${r.result.clips} clips)`); };
  $('file').onchange = async () => { const f = $('file').files[0]; if (!f) return; try { P = JSON.parse(await f.text()); $('name').value = P.name || ''; save(); palette(); refresh(); } catch (e) { alert('Not a puppet file'); } };

  palette(); refresh(); requestAnimationFrame(tick);
  window.RIG = { get puppet() { return P; }, load(p) { P = p; $('name').value = P.name || ''; palette(); refresh(); if (tool === 'pose') posePanel(); },
    get pose() { return poseW; }, handles: () => handles() }; // handle for scripted tests
})();
</script>
</body>
</html>
